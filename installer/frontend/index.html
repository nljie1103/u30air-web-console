<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Android Web Desktop · 设备管理器</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
    (() => {
      const methods = [
        'environment','list_devices','device_info','list_apps','get_logs',
        'clear_logs','connect','set_adb_path','choose_adb','choose_local_zip','choose_apk',
        'install_application','install_official_adb','check_release','install_latest',
        'install_local','read_auth','configure_auth','uninstall','uninstall_app',
        'set_system_app','reboot','poweroff','open_web'
      ];
      function connect() {
        const host = window.go?.main?.Host;
        if (!host || typeof host.Call !== 'function') return false;
        const api = Object.fromEntries(methods.map(name => [name, (...args) => host.Call(name,args)]));
        window.pywebview = {api};
        window.dispatchEvent(new Event('pywebviewready'));
        return true;
      }
      if (!connect()) {
        const timer = setInterval(() => { if (connect()) clearInterval(timer); }, 100);
        setTimeout(() => clearInterval(timer), 30000);
      }
      async function smoke() {
        const wait = async predicate => {
          for(let i=0;i<150;i++){if(predicate())return;await new Promise(r=>setTimeout(r,100));}
          throw Error('界面未就绪');
        };
        try {
          await wait(()=>window.pywebview?.api && document.querySelectorAll('.nav-item').length===6);
          const info=await window.pywebview.api.environment();
          if(!info.version)throw Error('业务后端未连接');
          const side=document.querySelector('.sidebar-toggle');
          side.click();side.click();
          for(const name of ['设备管理','应用管理','部署与更新','运行日志','设置','工作台']){
            document.querySelector('button.nav-item[title="'+name+'"]').click();
            await wait(()=>document.querySelector('.page-content h1')?.textContent.trim()===name);
          }
          await window.go.main.Host.SmokeResult(true,'');
        }catch(e){await window.go.main.Host.SmokeResult(false,String(e))}
      }
      window.addEventListener('awdsmoke',smoke,{once:true});
    })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
