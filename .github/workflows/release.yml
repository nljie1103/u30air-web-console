name: 构建与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Windows 安装器和模拟 ADB
        shell: powershell
        run: ./tests/windows-adb-tests.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 测试 Windows 管理器核心逻辑
        shell: pwsh
        run: |
          python -m compileall -q manager
          python -m unittest discover -s tests -p "test_manager_*.py" -v
          python manager/app.py --self-test
      - name: 构建 Windows GUI EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.12.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AndroidWebDesktopManager manager/app.py
          if (!(Test-Path -LiteralPath "dist/AndroidWebDesktopManager.exe")) { throw "Windows EXE was not generated" }
          $exe = (Resolve-Path "dist/AndroidWebDesktopManager.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--gui-smoke-test" -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Windows GUI executable smoke test failed: $($test.ExitCode)" }
          Write-Host "GUI EXE smoke test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-manager
          path: dist/AndroidWebDesktopManager.exe
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-manager
          path: dist/windows
      - name: 验证源码、语法与版本
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version version.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_TYPE" != "tag" || test "$GITHUB_REF_NAME" = "v$VERSION"
          git log -1 --format=%s | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+：.+$'
          grep -Fq "APP_VERSION = \"$VERSION\"" manager/app.py
          test -s dist/windows/AndroidWebDesktopManager.exe
          go test ./...
          go vet ./...
          node --check web/app.js
          bash -n installer/install_linux_mac.sh
          python3 -m unittest discover -s tests -p "test_manager_*.py"
          python3 -m compileall -q manager
      - name: 打包 Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version version.json)
          mkdir -p dist/package/installer
          cp README.md dist/package/README.md
          cp installer/* dist/package/installer/
          printf '%s\n' "$VERSION" > dist/package/VERSION
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/package/desktopd .
          (cd dist/package && zip -q -r ../android-web-desktop-arm64.zip README.md VERSION desktopd installer)
          unzip -t dist/android-web-desktop-arm64.zip | tail -1
          sha256sum dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe
      - name: 发布中文 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version version.json)
          TITLE=$(jq -r .title version.json)
          jq -r .notes version.json > dist/notes.md
          gh release create "v$VERSION" dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe \
            --title "v$VERSION｜$TITLE" \
            --notes-file dist/notes.md \
            --verify-tag
