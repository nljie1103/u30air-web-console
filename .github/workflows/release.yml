name: Windows WebView2 客户端与 Android ARM64 构建发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 预检版本、提交与统一图标
        run: python installer/tests/check_release.py
      - name: PowerShell 5.1 ADB 脚本测试
        shell: powershell
        run: ./installer/tests/windows-adb-tests.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: installer/host/go.sum
      - name: 安装业务后端打包工具
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            installer/frontend/package-lock.json
            web-console/tests/package-lock.json

      - name: 构建恢复的 Vue3/shadcn 风格 Windows 界面
        shell: pwsh
        run: |
          npm ci --prefix installer/frontend --no-audit --no-fund
          npm run build --prefix installer/frontend
          if ($LASTEXITCODE -ne 0) { throw "Vue3 build failed" }
          if (!(Test-Path "installer/frontend/dist/index.html")) { throw "Vue3 bundle missing" }
          node installer/frontend/tests/e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw "Original UI regression tests failed" }

      - name: Python ADB 后端与管道协议回归
        shell: pwsh
        run: |
          python -m compileall -q installer
          python -m unittest discover -s installer/tests -p "test_manager_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }

      - name: Android 8765 网页浏览器交互测试
        shell: pwsh
        run: |
          npm ci --prefix web-console/tests --no-audit --no-fund
          node web-console/tests/e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw "Android web UI tests failed" }

      - name: 打包轻量 Windows 客户端
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/host/build/frontend,dist | Out-Null
          Copy-Item installer/frontend/dist/* installer/host/build/frontend -Recurse -Force
          python -m PyInstaller --noconfirm --clean --onefile --console --name worker --distpath installer/host/build installer/worker.py
          if ($LASTEXITCODE -ne 0) { throw "Python worker build failed" }
          $env:CGO_ENABLED = "0"
          Push-Location installer/host
          try {
            go run ./resources
            if ($LASTEXITCODE -ne 0) { throw "Windows resources failed" }
            go build -trimpath -tags desktop,production -ldflags "-s -w -H windowsgui" -o ../../dist/AndroidWebDesktopManager.exe .
            if ($LASTEXITCODE -ne 0) { throw "Wails host build failed" }
          } finally { Pop-Location }
          $exe = (Resolve-Path "dist/AndroidWebDesktopManager.exe").Path
          $size = (Get-Item $exe).Length
          Write-Host "Standalone size: $size bytes"
          if ($size -gt 35MB) { throw "Lightweight client exceeded 35 MiB budget" }
          $env:AWD_SMOKE_LOG = (Join-Path (Get-Location) "dist/smoke.log")
          foreach ($arg in @("--self-test","--gui-smoke-test")) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -PassThru
            if (!$p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Client test timed out: $arg" }
            if (Test-Path $env:AWD_SMOKE_LOG) { Get-Content $env:AWD_SMOKE_LOG }
            if ($p.ExitCode -ne 0) { throw "Client test failed: $arg, exit $($p.ExitCode)" }
          }
          New-Item -ItemType Directory -Force dist/AndroidWebDesktopManager | Out-Null
          Copy-Item $exe dist/AndroidWebDesktopManager/
          Copy-Item installer/THIRD_PARTY_NOTICES.md dist/AndroidWebDesktopManager/
          Compress-Archive -Path dist/AndroidWebDesktopManager -DestinationPath dist/AndroidWebDesktopManager-Portable.zip -CompressionLevel Optimal -Force
          Expand-Archive dist/AndroidWebDesktopManager-Portable.zip dist/portable-test -Force
          $portable = (Resolve-Path "dist/portable-test/AndroidWebDesktopManager/AndroidWebDesktopManager.exe").Path
          if ((Get-FileHash $portable).Hash -ne (Get-FileHash $exe).Hash) { throw "Portable executable mismatch" }
          $p = Start-Process -FilePath $portable -ArgumentList "--self-test" -PassThru
          if (!$p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "Portable launch timed out" }
          if ($p.ExitCode -ne 0) { throw "Portable launch failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-manager
          path: |
            dist/AndroidWebDesktopManager.exe
            dist/AndroidWebDesktopManager-Portable.zip
          if-no-files-found: error
          retention-days: 7

  verify:
    permissions:
      contents: write
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-manager
          path: dist/windows
      - name: 验证版本、仓库目录与安全测试
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version web-console/version.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git log -1 --format=%s)" == "$VERSION"：* ]]
          cmp installer/assets/app-icon.svg installer/frontend/public/app-icon.svg
          cmp installer/assets/app-icon.svg web-console/web/app-icon.svg
          grep -Fq "APP_VERSION = \"$VERSION\"" installer/version.py
          node -e 'for (const dir of ["installer/frontend","web-console/tests"]) { const p=require("./"+dir+"/package.json"), l=require("./"+dir+"/package-lock.json"); if ([p.version,l.version,l.packages[""].version].some(v=>v!==process.argv[1])) throw Error("Version mismatch: "+dir); }' "$VERSION"
          test -s dist/windows/AndroidWebDesktopManager.exe
          test -s dist/windows/AndroidWebDesktopManager-Portable.zip
          test -s installer/assets/app.ico
          test -s installer/assets/app-icon.png
          test -f installer/host/main.go
          test -f installer/worker.py
          ! test -e installer/qt_window.py
          test -f installer/frontend/package.json
          test -f installer/frontend/src/App.vue
          ! test -e installer/edge_host.py
          (cd web-console && go test -race ./... && go vet ./...)
          node --check web-console/web/app.js
          node --check installer/frontend/tests/e2e.mjs
          bash -n web-console/deploy/install_linux_mac.sh
          sh -n web-console/deploy/stop.sh
          python3 -m unittest discover -s installer/tests -p "test_manager_*.py"
          python3 -m compileall -q installer
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          roots={p.split('/')[0] for p in paths}
          assert roots=={'.github','.gitignore','README.md','installer','web-console'},roots
          print('Project root, lightweight WebView2 host and Vue3 sources verified')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 编译 Android 原生图标辅助组件
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/awd-sdk"
          mkdir -p "$SDK"
          curl -fLsS --retry 3 --max-time 180 https://dl.google.com/android/repository/platform-35_r02.zip -o "$SDK/platform.zip"
          curl -fLsS --retry 3 --max-time 180 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o "$SDK/tools.zip"
          (cd "$SDK" && printf '%s  %s\n' 0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0 platform.zip bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88 tools.zip | sha256sum -c -)
          unzip -qo "$SDK/platform.zip" -d "$SDK"
          unzip -qo "$SDK/tools.zip" -d "$SDK"
          ANDROID_JAR="$SDK/android-35/android.jar" D8="$SDK/android-15/d8" bash web-console/native-icons/build.sh
          (cd web-console && go test -tags nativeicons -race ./... && go vet -tags nativeicons ./...)
      - name: 构建 Android ARM64 ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version web-console/version.json)
          mkdir -p dist/package/installer
          cp README.md dist/package/README.md
          cp web-console/deploy/* dist/package/installer/
          cp web-console/THIRD_PARTY_NOTICES.md dist/package/THIRD_PARTY_NOTICES.md
          printf '%s\n' "$VERSION" > dist/package/VERSION
          (cd web-console && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags nativeicons -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../dist/package/desktopd .)
          go version -m dist/package/desktopd
          go version -m dist/windows/AndroidWebDesktopManager.exe
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" -mode=binary dist/package/desktopd
          "$(go env GOPATH)/bin/govulncheck" -mode=binary dist/windows/AndroidWebDesktopManager.exe
          (cd dist/package && zip -q -r ../android-web-desktop-arm64.zip README.md VERSION desktopd THIRD_PARTY_NOTICES.md installer)
          unzip -t dist/android-web-desktop-arm64.zip | tail -1
          sha256sum dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe dist/windows/AndroidWebDesktopManager-Portable.zip
      - name: 创建中文 GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version web-console/version.json)
          TITLE=$(jq -r .title web-console/version.json)
          jq -r .notes web-console/version.json > dist/notes.md
          HEAD_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$HEAD_SHA" != "$MAIN_SHA" ]]; then
            echo "Superseded build; skip release"
            exit 0
          fi
          TAG="v$VERSION"
          REMOTE_TAG=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [[ -n "$REMOTE_TAG" && "$REMOTE_TAG" != "$HEAD_SHA" ]]; then
            echo "Existing release tag points to another commit; refusing to change it" >&2
            exit 1
          elif [[ -z "$REMOTE_TAG" ]]; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > dist/existing-release.json
            for asset in dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe dist/windows/AndroidWebDesktopManager-Portable.zip; do
              name="$(basename "$asset")"
              digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
              jq -e --arg name "$name" --arg digest "$digest" '.assets | any(.name==$name and .state=="uploaded" and .digest==$digest)' dist/existing-release.json >/dev/null || { echo "Existing release asset mismatch: $name" >&2; exit 1; }
            done
            echo "Release $TAG already exists at correct commit"
            exit 0
          fi
          gh release create "$TAG" dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe dist/windows/AndroidWebDesktopManager-Portable.zip --title "$TAG｜$TITLE" --notes-file dist/notes.md --verify-tag
