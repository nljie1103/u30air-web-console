name: 编译与发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证原有 Windows ADB 安装器
        shell: powershell
        run: ./tests/windows-adb-tests.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: manager/frontend/package-lock.json
      - name: 构建 Vue 3 界面
        shell: pwsh
        run: |
          npm ci --prefix manager/frontend --no-audit --no-fund
          npm run build --prefix manager/frontend
          if (!(Test-Path "manager/frontend/dist/index.html")) { throw "Vue production build is missing" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chromium/Edge 页面端到端测试
        shell: pwsh
        run: node manager/frontend/tests/e2e.mjs
      - name: 验证管理器后端与 Vue 构建
        shell: pwsh
        run: |
          python -m compileall -q manager
          python -m unittest discover -s tests -p "test_manager_*.py" -v
      - name: 构建 WebView2 图形化 EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywebview==6.2.1 pyinstaller==6.22.3
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AndroidWebDesktopManager --collect-all webview --add-data "manager/frontend/dist;manager/frontend/dist" manager/app.py
          if (!(Test-Path "dist/AndroidWebDesktopManager.exe")) { throw "Missing manager EXE" }
          $exe = (Resolve-Path "dist/AndroidWebDesktopManager.exe").Path
          $check = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Packaged frontend / bridge smoke test failed: $($check.ExitCode)" }
          $gui = Start-Process -FilePath $exe -ArgumentList "--gui-smoke-test" -PassThru
          try {
            $gui.WaitForExit(45000) | Out-Null
            $gui.Refresh()
            if (!$gui.HasExited) { throw "WebView2 GUI integration test timed out" }
            if ($gui.ExitCode -ne 0) { throw "WebView2 GUI integration test failed: $($gui.ExitCode)" }
          } finally {
            $smokeLog = Join-Path $env:TEMP "awd-webview2-smoke.log"
            if (Test-Path -LiteralPath $smokeLog) {
              Write-Host "WebView2 integration diagnostic:"; Get-Content -LiteralPath $smokeLog -Tail 80
            }
            if (!$gui.HasExited) { Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "Vue 3 WebView2 EXE smoke tests passed"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-manager
          path: dist/AndroidWebDesktopManager.exe
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-manager
          path: dist/windows
      - name: 验证版本与代码
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version version.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_TYPE" != "tag" || test "$GITHUB_REF_NAME" = "v$VERSION"
          git log -1 --format=%s | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+：.+$'
          grep -Fq "APP_VERSION = \"$VERSION\"" manager/app.py
          node -e "const p=require('./manager/frontend/package.json'); if(p.version!==process.argv[1]) process.exit(1)" "$VERSION"
          test -s dist/windows/AndroidWebDesktopManager.exe
          go test ./...
          go vet ./...
          node --check web/app.js
          bash -n installer/install_linux_mac.sh
          python3 -m unittest discover -s tests -p "test_manager_*.py"
          python3 -m compileall -q manager
      - name: 生成 Android ARM64 安装包
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version version.json)
          mkdir -p dist/package/installer
          cp README.md dist/package/README.md
          cp installer/* dist/package/installer/
          printf '%s\n' "$VERSION" > dist/package/VERSION
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/package/desktopd .
          (cd dist/package && zip -q -r ../android-web-desktop-arm64.zip README.md VERSION desktopd installer)
          unzip -t dist/android-web-desktop-arm64.zip | tail -1
          sha256sum dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe
      - name: 发布中文 Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version version.json)
          TITLE=$(jq -r .title version.json)
          jq -r .notes version.json > dist/notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; skip publishing"
            exit 0
          fi
          if ! git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          gh release create "v$VERSION" dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe \
            --title "v$VERSION｜$TITLE" \
            --notes-file dist/notes.md \
            --verify-tag
