name: 构建与发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证原有 PowerShell 5.1 部署脚本
        shell: powershell
        run: ./installer/tests/windows-adb-tests.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer/frontend/package-lock.json
      - name: Vue 3 类型检查与生产构建
        shell: pwsh
        run: |
          npm ci --prefix installer/frontend --no-audit --no-fund
          npm run build --prefix installer/frontend
          if (!(Test-Path "installer/frontend/dist/index.html")) { throw "Vue production build is missing" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Edge 浏览器界面与实际 Python 接口联动测试
        shell: pwsh
        run: |
          node installer/frontend/tests/e2e.mjs
          node installer/frontend/tests/edge-e2e.mjs
          node installer/frontend/tests/webconsole-apps-e2e.mjs
      - name: Windows 管理器后端回归测试
        shell: pwsh
        run: |
          python -m compileall -q installer
          python -m unittest discover -s installer/tests -p "test_manager_*.py" -v
      - name: 构建原生 Edge 应用窗口与便携版
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          $assets = "installer/frontend/dist;installer/frontend/dist"
          $common = @("--noconfirm","--clean","--windowed","--name","AndroidWebDesktopManager","--add-data",$assets,"installer/app.py")
          python -m PyInstaller --onedir @common
          if ($LASTEXITCODE -ne 0) { throw "Portable build failed" }
          $portableExe = (Resolve-Path "dist/AndroidWebDesktopManager/AndroidWebDesktopManager.exe").Path
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $portable = Start-Process -FilePath $portableExe -ArgumentList "--self-test" -PassThru -Wait
          $sw.Stop()
          if ($portable.ExitCode -ne 0) { throw "Portable build self-test failed" }
          Write-Host ("Portable EXE self-test duration: {0} ms" -f $sw.ElapsedMilliseconds)
          Compress-Archive -Path "dist/AndroidWebDesktopManager" -DestinationPath "dist/AndroidWebDesktopManager-Portable.zip" -CompressionLevel Optimal -Force
          if (!(Test-Path "dist/AndroidWebDesktopManager-Portable.zip")) { throw "Portable ZIP missing" }

          python -m PyInstaller --onefile @common
          if ($LASTEXITCODE -ne 0) { throw "Single-file EXE build failed" }
          $singleExe = (Resolve-Path "dist/AndroidWebDesktopManager.exe").Path
          $sw.Restart()
          $single = Start-Process -FilePath $singleExe -ArgumentList "--self-test" -PassThru -Wait
          $sw.Stop()
          if ($single.ExitCode -ne 0) { throw "Single-file EXE self-test failed" }
          Write-Host ("Single-file EXE self-test duration: {0} ms" -f $sw.ElapsedMilliseconds)

      - name: Windows 实际拖动窗口后验证 Edge 和设备管理接口
        shell: pwsh
        run: |
          node installer/frontend/tests/windows-edge-window.mjs
          $env:AWD_EXE_PATH = (Resolve-Path "dist/AndroidWebDesktopManager.exe").Path
          node installer/frontend/tests/windows-edge-window.mjs
          Remove-Item Env:AWD_EXE_PATH
      - name: 确认安装包不再依赖 pythonnet/WinForms
        shell: pwsh
        run: |
          if (Test-Path "dist/AndroidWebDesktopManager/_internal/pythonnet") { throw "Unexpected pythonnet runtime in portable build" }
          if (Test-Path "dist/AndroidWebDesktopManager/_internal/webview") { throw "Unexpected pywebview runtime in portable build" }
          Write-Host "WinForms/pythonnet removed from both packages"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-manager
          path: |
            dist/AndroidWebDesktopManager.exe
            dist/AndroidWebDesktopManager-Portable.zip
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web-console/go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-manager
          path: dist/windows
      - name: 验证版本、代码及目录
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version web-console/version.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git log -1 --format=%s | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+：.+$'
          grep -Fq "APP_VERSION = \"$VERSION\"" installer/app.py
          node -e "const p=require('./installer/frontend/package.json'); if(p.version!==process.argv[1]) process.exit(1)" "$VERSION"
          test -s dist/windows/AndroidWebDesktopManager.exe
          test -s dist/windows/AndroidWebDesktopManager-Portable.zip
          test -f installer/adb_client.py
          test -f web-console/main.go
          (cd web-console && go test -race ./... && go vet ./...)
          node --check web-console/web/app.js
          bash -n web-console/deploy/install_linux_mac.sh
          sh -n web-console/deploy/stop.sh
          python3 -m unittest discover -s installer/tests -p "test_manager_*.py"
          python3 -m compileall -q installer
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          roots={p.split('/')[0] for p in paths}
          expected={'.github','.gitignore','README.md','installer','web-console'}
          assert roots == expected, (roots,expected)
          print('Tracked project layout verified; generated dist/ excluded')
          PY
      - name: 构建 Android ARM64 ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version web-console/version.json)
          mkdir -p dist/package/installer
          cp README.md dist/package/README.md
          cp web-console/deploy/* dist/package/installer/
          cp web-console/THIRD_PARTY_NOTICES.md dist/package/THIRD_PARTY_NOTICES.md
          printf '%s\n' "$VERSION" > dist/package/VERSION
          (cd web-console && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../dist/package/desktopd .)
          (cd dist/package && zip -q -r ../android-web-desktop-arm64.zip README.md VERSION desktopd THIRD_PARTY_NOTICES.md installer)
          unzip -t dist/android-web-desktop-arm64.zip | tail -1
          sha256sum dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe dist/windows/AndroidWebDesktopManager-Portable.zip
      - name: 创建中文 Release（一次构建）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version web-console/version.json)
          TITLE=$(jq -r .title web-console/version.json)
          jq -r .notes web-console/version.json > dist/notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; skip publishing"
            exit 0
          fi
          if ! git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          gh release create "v$VERSION" dist/android-web-desktop-arm64.zip dist/windows/AndroidWebDesktopManager.exe dist/windows/AndroidWebDesktopManager-Portable.zip \
            --title "v$VERSION｜$TITLE" \
            --notes-file dist/notes.md \
            --verify-tag
